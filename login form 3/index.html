<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="swiper-bundle-css.css">
</head>
<body>
    <div class="container">
        <div class="img-swiper swiper">
            <div class="box swiper"></div>
            <div class="login-swiper-data">
                <p class="login-sub">Welcome Back</p>

                <h1 class="login-title">Hello Developer,</h1> <br>Sign In to Get Started.
            </div>

            <div class="login-swiper-social">
                <p class="login-sub">Our Social Media</p>
                <div class="login-links">
                    <a href="#" target="_blank" class="login-link">
                        <i class="ri-facebook-box-line"></i>
                    </a>
                    <a href="#" target="_blank" class="login-link">
                        <i class="ri-instagram-line"></i>
                    </a>
                    <a href="#" target="_blank" class="login-link">
                        <i class="ri-twitter-x-line"></i>
                    </a>
                    <a href="#" target="_blank" class="login-link">
                        <i class="ri-github-fill"></i>
                    </a>
                    
                </div>
            </div>

            <div class="swiper-wrapper">
                <img src="https://cdn.wallpapersafari.com/62/13/790wfH.jpg" alt="" class="login-swiper-img swiper-slide">

                <img src="https://tse3.mm.bing.net/th/id/OIP.W-kSxoPlxQUSa9vQ97x0gwHaNJ?cb=12&pid=ImgDet&w=178&h=315&c=7&dpr=1.5&o=7&rm=3" alt="" class="login-swiper-img swiper-slide">
            </div>

             <div class="swiper-pagination"></div>
        </div>

        <div class="login-section">
            <h1 class="login-head">Welcome Back 👋</h1>
            <p>Please enter your details.</p>

            <button class="login-btn">
                <i class="ri-google-fill"></i>
                Sign in with Google
            </button>

            <span class="login-line">or</span>

            <form action="" class="login-form">
                <div class="login-content">
                    <div class="login-box">
                        <input type="email" name="email" placeholder="Enter Email" required>
                        <i class="ri-mail-line"></i>
                    </div>

                    <div class="login-box">
                        <input type="password" name="password" placeholder="Enter password" required id="password">
                        <i class="ri-eye-line" id="eye"></i>
                    </div>
                </div>

                <a href="#" class="fopa">Forgot Password?</a>
                <div class="btn">
                    <button class="login-form-btn">Log In</button>
                </div>

                <div class="signup">
                    Don't have an account? <a href="#">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <script src="swiper-bundle.js"></script>
    <script src="script.js"></script>

    
</body>
</html>
