<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css">
</head>

<body>
    <svg class="blob-clip" viewBox="0 0 566 840" xmlns="http://www.w3.org/2000/svg">
        <mask id="mask0" mask-type="alpha">
            <path
                d="M342.407 73.6315C388.53 56.4007 394.378 17.3643 391.538 0H566V840H0C14.5385 834.991 100.266 804.436 77.2046 707.263C49.6393 591.11 115.306 518.927 176.468 488.873C363.385 397.026 156.98 302.824 167.945 179.32C173.46 117.209 284.755 95.1699 342.407 73.6315Z" />
        </mask>
        <g mask="url(#mask0)">
            <path
                d="M342.407 73.6315C388.53 56.4007 394.378 17.3643 391.538 0H566V840H0C14.5385 834.991 100.266 804.436 77.2046 707.263C49.6393 591.11 115.306 518.927 176.468 488.873C363.385 397.026 156.98 302.824 167.945 179.32C173.46 117.209 284.755 95.1699 342.407 73.6315Z" />
            <!-- Insert your image (recommended size: 1000 x 1200) -->
            <image href="https://pbs.twimg.com/media/FkhsjevXEBQvIe3.jpg" />
              
        </g>
    </svg>

    <div class="container" id ="loginAccessReg">
        <div class="login-cont login-access">
            <h1 class="heading">Log in to your account.</h1>
            <div class="login-cont-grid">

                <form action="get" class="login-form">
                    <div class="login-input">
                        <div class="login-box">
                            <input type="text" name="emal" id="email" placeholder=" ">
                            <label class="input-label" for="email">Email</label>
                            <i class="ri-mail-fill input-icon"></i>
                        </div>

                        <div class="login-box">
                            <input type="password" name="password" id="password" placeholder=" ">
                            <label class="input-label" for="password">Password</label>
                            <i class="ri-eye-off-fill input-icon" id="eye"></i>
                        </div>
                    </div>

                    <a href="#" class="for-pass">Forgot your passowrd?</a>
                    <button type="submit" class="login-btn" id="login-btn">Login</button>
                </form>

                <div class="login-social">
                    <p>or login with</p>
                    <div class="login-icons">
                        <a href="#" class="google-icon icon">
                            <img src="google-icon.svg" alt="" class="google-icon">
                        </a>

                        <a href="#" class="facebook-icon icon">
                            <img src="facebook-icon.svg" alt="" class="facebook-icon">
                        </a>

                        <a href="#" class="insta-icon icon">
                            <img src="insta-icon.svg" alt="" class="insta-icon">
                        </a>
                    </div>
                </div>

                <div class="create-acc">
                    <span>Don't have an account?</span>
                    <a href="#" id="cAcc">Create Account</a>
                </div>
            </div>
        </div>

        <div class="create-account login-reg">
            <h1 class="heading">Create new account.</h1>
            <div class="acc-grid login-cont-grid">
                <form action="" class="login-form create-acc-form">

                    <div class="name-grid">
                        <div class="login-box">
                            <input type="text" name="name" id="name" placeholder=" " required>
                            <label for="name" class="input-label">Name</label>
                            <i class="ri-id-card-fill input-icon"></i>
                        </div>
                        
                        <div class="login-box">
                            <input type="text" name="surname" id="surname" placeholder=" ">
                            <label for="surname" class="input-label">Surname</label>
                            <i class="ri-id-card-fill input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="login-box">
                        <input type="text" name="emal" id="email-sec" placeholder=" ">
                        <label class="input-label" for="email-sec">Email</label>
                        <i class="ri-mail-fill input-icon"></i>
                    </div>
                    
                    <div class="login-box">
                        <input type="password" name="password" id="password-sec" placeholder=" ">
                        <label class="input-label" for="password-sec">Password</label>
                        <i class="ri-eye-off-fill input-icon" id="eye1"></i>
                    </div>

                    <button class="login-btn create-acc-btn">create account</button>
                </form>

                <div class="create-acc login-acc">
                    <span>Already have an account?</span>
                    <a href="#" id="login">Log In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
