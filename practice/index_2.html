<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scrolling animation</title>
    <style>
        body{
            background-color: black;
        }

        
        .block{
            width:300px;
            height:200px;
            background-color: rgb(203, 150, 248);
            margin: 10px;
            animation:scroll-effect linear;
            animation-timeline: view();
            animation-range: entry 0;
        }

        @keyframes scroll-effect{
            from{
                opacity:0;
                scale:0.5;
            }
            to{
                opacity:1;
                scale:1;
            }
        }

    </style>
</head>
<body>
    <div class="scroll">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
    </div>
</body>
</html>
