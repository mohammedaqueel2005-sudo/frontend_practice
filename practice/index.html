<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            justify-content:center;
            align-items: center;
            height:80vh;
        }
        .box{
            width:200px;
            height:200px;
            /* border-radius:15px; */
            background-color: pink;
            transition:transform 1s ease ,background-color 1s ease,border-radius 1s ease;
        }

        .box:hover{
            transform:rotate(360deg) scale(2);
            background-color: rgb(142, 204, 255);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
