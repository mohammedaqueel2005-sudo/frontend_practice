        /* h1::before{

        h1{
            position:relative;
        }

        h1::after{
            content:'';
            position: absolute;
            background:linear-gradient(to right,#cd00a1,#29abcd);
            width:10px;
            height:2px;
            bottom:0;
            left:0;
            border-radius: 10px;
            transition: width 1s ease;
        }

        h1:hover::after{
            width:100%;
        }
    </style>
</head>
<body>
    <h1>Mohammed Aqueel</h1>
</body>
